<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原田幸汰</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠️</text></svg>">
<style>
  :root, :root[data-theme="light"] { --bg:#fff; --fg:#111; --dim:#767676; --line:#dcdcdc; --accent:#111; --glow:17,17,17; }
  :root[data-theme="dark"] { --bg:#111; --fg:#f2f2f2; --dim:#8a8a8a; --line:#2c2c2c; --accent:#f2f2f2; --glow:255,255,255; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#f2f2f2; --dim:#8a8a8a; --line:#2c2c2c; --accent:#f2f2f2; --glow:255,255,255; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 8vh 24px;
    transition: background-color .5s, color .5s;
  }

  .glow {
    position: fixed; inset: 0 auto auto 0; width: 480px; height: 480px; margin: -240px 0 0 -240px;
    border-radius: 50%; pointer-events: none; z-index: 0; will-change: transform;
    background: radial-gradient(circle, rgba(var(--glow), .06) 0%, rgba(var(--glow), 0) 70%);
  }

  main { position: relative; z-index: 1; width: 100%; max-width: 420px; }

  .reveal { opacity: 0; transform: translateY(10px); animation: rise .7s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .name { font: 700 clamp(23px,5vw,28px)/1.3 inherit; letter-spacing: .04em; margin: 0 0 2.6em; }
  section + section { margin-top: 2.6em; }
  .label { font-size: 13px; font-weight: 500; letter-spacing: .16em; color: var(--dim); margin: 0 0 .9em; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); transition: border-color .5s; }
  li:last-child { border-bottom: 1px solid var(--line); }

  li a, li span {
    position: relative; display: flex; align-items: center; padding: 1.15em 0;
    font-size: 16px; letter-spacing: .01em; transition: transform .5s cubic-bezier(.22,1,.36,1), color .4s;
  }
  li span { color: var(--dim); }
  li a {
    color: var(--fg); text-decoration: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }

  li a::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    margin-right: 0; transform: scale(0);
    transition: margin-right .45s cubic-bezier(.22,1,.36,1), transform .45s cubic-bezier(.22,1,.36,1);
  }
  li a::after {
    content: ""; position: absolute; left: 0; bottom: .85em; height: 1px; width: 100%;
    background: var(--accent); transform: scaleX(0); transform-origin: left;
    transition: transform .5s cubic-bezier(.22,1,.36,1);
  }

  li a:focus-visible, li a:active { transform: translateX(10px); }
  li a:focus-visible::before, li a:active::before { margin-right: 12px; transform: scale(1); }
  li a:focus-visible::after, li a:active::after { transform: scaleX(1); }
  li a:active {
    transform: translateX(10px) scale(.985);
    transition-duration: .12s, .12s;
    transition-timing-function: cubic-bezier(.33,1,.68,1);
  }
  li a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

  @media (hover: hover) and (pointer: fine) {
    li a:hover { transform: translateX(10px); }
    li a:hover::before { margin-right: 12px; transform: scale(1); }
    li a:hover::after { transform: scaleX(1); }
  }

  @media (prefers-reduced-motion: reduce), (pointer: coarse) {
    .glow { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; transform: none; }
    li a, li a::before, li a::after { transition: none; }
  }

  li span.offline::after { content: "（停止中）"; margin-left: .6em; font-size: 12px; }
</style>
</head>
<body>

<div class="glow" id="glow"></div>

<main>
  <h1 class="name reveal" style="animation-delay:0s">原田 幸汰</h1>

  <section>
    <h2 class="label reveal" style="animation-delay:.08s">SNS</h2>
    <ul>
      <li class="reveal" style="animation-delay:.14s">
        <a href="https://www.instagram.com/harakou_6323/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </li>
    </ul>
  </section>

  <section>
    <h2 class="label reveal" style="animation-delay:.2s">APPS</h2>
    <ul>
      <li class="reveal" style="animation-delay:.26s"><span>スケジュール管理アプリ</span></li>
      <li class="reveal" style="animation-delay:.32s"><a href="https://poke-team-builder-kohl.vercel.app" target="_blank" rel="noopener noreferrer">ポケモン最強パーティ構築ツール</a></li>
      <li class="reveal" style="animation-delay:.38s"><a href="https://antirust-skillet-granular.ngrok-free.dev" target="_blank" rel="noopener noreferrer">扶養管理アプリ</a></li>
      <li class="reveal" id="onanikki-item" style="animation-delay:.44s"><span>おなにっき</span></li>
      <li class="reveal" id="futari-kitchen-item" style="animation-delay:.5s"><span>ふたりキッチン</span></li>
      <li class="reveal" style="animation-delay:.56s"><a href="https://claude.ai/code/artifact/a4015d24-ac71-414c-8d07-085628263b74" target="_blank" rel="noopener noreferrer">解析学 復習ツール</a></li>
    </ul>
  </section>
</main>

<script>
  // enables :active feedback reliably on iOS Safari
  addEventListener("touchstart", () => {}, { passive: true });

  if (!matchMedia("(prefers-reduced-motion: reduce)").matches && matchMedia("(hover: hover) and (pointer: fine)").matches) {
    const glow = document.getElementById("glow");
    let tx = innerWidth / 2, ty = innerHeight / 2, x = tx, y = ty;
    addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; });
    (function tick() {
      x += (tx - x) * .08; y += (ty - y) * .08;
      glow.style.transform = `translate(${x}px,${y}px)`;
      requestAnimationFrame(tick);
    })();
  }

  // 起動のたびにURLが変わるアプリは status.json から毎回最新のトンネルURLを取得する
  const LIVE_LINKS = [
    { itemId: "onanikki-item", key: "onanikkiUrl", label: "おなにっき" },
    { itemId: "futari-kitchen-item", key: "futariKitchenUrl", label: "ふたりキッチン" },
  ];

  function showOffline(itemId, label) {
    document.getElementById(itemId).innerHTML = `<span class="offline">${label}</span>`;
  }

  function refreshLiveLinks() {
    fetch("./status.json?t=" + Date.now())
      .then(r => r.json())
      .then(status => {
        for (const { itemId, key, label } of LIVE_LINKS) {
          const url = status[key];
          const item = document.getElementById(itemId);
          if (!url) { showOffline(itemId, label); continue; }
          const existing = item.querySelector("a");
          if (existing && existing.href === url) continue; // 変化なし
          const a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = label;
          item.replaceChildren(a);
        }
      })
      .catch(() => {
        LIVE_LINKS.forEach(({ itemId, label }) => showOffline(itemId, label));
      });
  }

  // タブを開いたままでも最新のURLに追従させる:
  // 定期ポーリングに加え、タブに戻ってきた瞬間にも再取得する
  refreshLiveLinks();
  setInterval(refreshLiveLinks, 20_000);
  addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshLiveLinks();
  });
</script>

</body>
</html>
