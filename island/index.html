<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アクションボード島（マップ試作）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>">
<style>
  :root {
    --sea:#79c9c4; --ink:#3b3226; --paper:#fffaf0; --line:#e6dcc6;
    --policy:#e07a5f; --pr:#eeb02f; --plan:#b678c9; --eng:#4a8fd9; --office:#7d8c9a; --all:#d9534a; --guest:#9a7b62;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--sea); color:var(--ink); overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","M PLUS Rounded 1c","Yu Gothic","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column;
  }
  header {
    flex:none; padding:calc(10px + env(safe-area-inset-top)) 16px 8px; background:var(--paper);
    border-bottom:3px solid var(--line); z-index:2;
  }
  h1 { margin:0; font-size:17px; letter-spacing:.04em; }
  h1 small { font-size:11px; font-weight:500; color:#8a7a62; margin-left:.5em; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin:8px -16px 0; padding:0 16px 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; border:2px solid var(--line); background:#fff; color:var(--ink); font:inherit; font-size:12px; font-weight:700;
    padding:5px 10px 5px 8px; border-radius:99px; display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  .chip i { width:10px; height:10px; border-radius:50%; background:var(--c); }
  .chip[aria-pressed="true"] { border-color:var(--c); background:color-mix(in srgb, var(--c) 16%, #fff); }

  #stage { flex:1; overflow:auto; position:relative; -webkit-overflow-scrolling:touch; }
  #map { display:block; width:100%; height:auto; min-height:100%; }
  @media (min-aspect-ratio: 1/1) { #map { width:auto; height:100%; margin:0 auto; } }

  .zoom { position:fixed; right:12px; bottom:calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:6px; z-index:3; }
  .zoom button {
    width:44px; height:44px; border-radius:14px; border:3px solid var(--line); background:var(--paper); color:var(--ink);
    font:700 22px/1 inherit; cursor:pointer; box-shadow:0 3px 0 rgba(59,50,38,.18);
  }

  .spot { cursor:pointer; }
  .spot:focus { outline:none; }
  .spot:focus-visible .hit { stroke:#fff; stroke-width:4; }
  .label { font-weight:800; font-size:25px; fill:var(--ink); stroke:#fffaf0; stroke-width:7; paint-order:stroke; stroke-linejoin:round; text-anchor:middle; pointer-events:none; }
  .label.m { font-size:22px; }
  .label.s { font-size:19px; stroke-width:6; }
  .dim .spot:not(.on), .dim .tree { opacity:.28; }
  .spot, .tree { transition:opacity .25s; }
  .spot.on .bob { animation:bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-5px); } }
  .wave { animation:drift 7s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translateX(14px); } }
  @media (prefers-reduced-motion: reduce) { .wave, .spot.on .bob { animation:none; } }

  #sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:4; background:var(--paper); border-top:3px solid var(--line);
    border-radius:22px 22px 0 0; padding:14px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .28s cubic-bezier(.22,1,.36,1); max-height:60vh; overflow:auto;
    box-shadow:0 -6px 24px rgba(59,50,38,.18);
  }
  #sheet.open { transform:none; }
  #sheet .tag { display:inline-block; font-size:11px; font-weight:800; color:#fff; background:var(--c,#888); padding:3px 9px; border-radius:99px; }
  #sheet h2 { margin:8px 0 4px; font-size:19px; }
  #sheet p { margin:0 0 10px; font-size:14px; line-height:1.7; }
  #sheet ul { margin:0; padding:0; list-style:none; display:grid; gap:6px; }
  #sheet li { font-size:13px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:8px 12px; }
  #sheet .close { position:absolute; right:12px; top:10px; width:36px; height:36px; border:0; border-radius:50%; background:#efe6d2; font:700 16px/1 inherit; color:var(--ink); cursor:pointer; }
  #sheet .note { font-size:11px; color:#8a7a62; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>アクションボード島<small>マップ試作 v1</small></h1>
  <div class="chips" id="chips"></div>
</header>
<div id="stage"><svg id="map" viewBox="0 0 900 1200" role="img" aria-label="アクションボード島のマップ"></svg></div>
<div class="zoom"><button id="zin" aria-label="拡大">＋</button><button id="zout" aria-label="縮小">－</button></div>
<div id="sheet" role="dialog" aria-live="polite"></div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const el = (name, attrs = {}, parent = svg) => {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n); return n;
};

/* ============ 島の定義（マス目単位。ここを書き換えると島が変わる） ============ */
const W = 32, H = 42, T = 28, OX = 2, OY = 12;        // 横32マス×縦42マス
// 四角形は [x, y, 幅, 高さ]
const GRASS  = [[5,4,22,32],[4,6,24,28],[3,9,1,22],[28,12,1,18],[6,3,16,1],[5,36,4,1],[20,36,6,1]];
const BEACH  = [[10,36,8,3],[1,27,3,5],[28,31,2,4],[26,3,3,2]];
const TIER2  = [[4,4,24,11],[4,15,6,3],[20,15,8,4],[3,8,1,8]];
const TIER3  = [[16,4,12,6],[20,10,8,2],[16,3,6,1]];
const WATER  = [[17,5,3,2],[18,7,2,22],[9,24,11,2],[9,24,2,18],[18,27,14,2]];   // 池・川
const ROADS  = [[4,20,24,1],[13,6,1,12],[5,8,9,1],[5,12,9,1],[21,5,1,15],[21,5,4,1],[22,9,6,1],
                [6,20,1,8],[13,23,1,15],[13,33,8,1],[24,20,1,3]];
const PLAZAS = [[11,18,5,5],[20,31,5,4]];
const ROCKS  = [[2,5],[3,4],[29,7],[30,9],[29,22],[2,34],[3,37],[27,38],[29,36],[8,2],[15,1]];

const DEPTS = {
  all:    { name:'全体',     color:'#d9534a', mark:'全' },
  policy: { name:'政策立案', color:'#e07a5f', mark:'政' },
  pr:     { name:'広報',     color:'#e0a21c', mark:'広' },
  plan:   { name:'企画',     color:'#b06ac4', mark:'企' },
  eng:    { name:'エンジニア', color:'#3f83d1', mark:'エ' },
  office: { name:'事務局',   color:'#6f7f8e', mark:'事' },
  culture:{ name:'文化',     color:'#2f9e7c', mark:'文' },
};
const BUILDINGS = [   // x, y はマス目の座標
  { id:'hall',   dept:'all',    x:13, y:19.6, big:true, label:'みんなの集会所',
    desc:'学生チーム全員用の建物。島の真ん中の広場に建っている。',
    todo:['全体タスクボード（今のアクションボードのトップ）','全体告知の掲示板','今週の達成・MVP の発表'] },
  { id:'policy', dept:'policy', x:14.6, y:10, label:'政策立案の館',
    desc:'政策立案部門の建物。北西の高台に、メンバーの家が並ぶ島でいちばん大きな集落がある。',
    todo:['部門のタスクボード','リサーチノート・Polis の論点置き場','部門ミーティングの予定'] },
  { id:'eng',    dept:'eng',    x:25, y:4.6, label:'エンジニア工房',
    desc:'エンジニア部門の建物。滝の上、島でいちばん高い場所にある。',
    todo:['開発タスク・Issue ボード','リリースのお知らせ','つくったツールの展示'] },
  { id:'plan',   dept:'plan',   x:24, y:23.2, label:'企画のアトリエ',
    desc:'企画部門の建物。橋をわたった東の岸にある。',
    todo:['イベント企画のタスクボード','アイデアのたまり場','開催スケジュール'] },
  { id:'pr',     dept:'pr',     x:6, y:28.6, label:'広報スタジオ',
    desc:'広報部門の建物。西の浜辺の近く。',
    todo:['発信物の制作タスク','SNS 投稿カレンダー','素材置き場'] },
  { id:'office', dept:'office', x:8.5, y:18.6, label:'事務局',
    desc:'事務局の建物。集会所のすぐ西で島全体を支える。',
    todo:['運営タスク・手続き','新メンバーの受け入れ窓口','島のルール・ガイド'] },
];
const HOUSES = [      // 部門ごとの軒数は 2026-11 時点のメンバー数（名前は載せていない）
  { dept:'policy', at:[5,7,9,11].flatMap(x => [6,10,14].map(y => [x, y])).concat([[6,4],[8,4],[10,4],[12,4]]) },
  { dept:'eng',    at:[[23,8],[25,8],[27,8],[23,10],[25,10],[27,10]] },
  { dept:'plan',   at:[[21,22],[27,22],[21,24],[27,24],[21,26],[27,26],[20,22]] },
  { dept:'pr',     at:[[4,32],[7,32],[5,34]] },
  { dept:'office', at:[[5,18],[4,22]] },
  { dept:'all',    at:[[8,22],[10,23],[16,23]], note:'代表・サポーター' },
];
const SIGNS = [[12,26],[14,28],[12,30],[14,31],[12,35],[14,36]];   // times通りの立て札
const TENTS = [[20.6,31.6,'#ff9db0'],[22.5,31.2,'#7fd3c1'],[24,32,'#ffd166'],[21.4,33.9,'#a8b8ff'],[23.4,34.2,'#f4a261']];
const ZONES = {
  times:  { dept:'culture', label:'times通り', lx:16.4, ly:30.4,
    desc:'集会所から船着き場へつづく一本道。メンバーそれぞれの「times」の立て札が並ぶ。',
    todo:['各メンバーの times（つぶやき）を立て札として表示','新しい投稿があると札が光る','歩きながら近況を眺められる'] },
  circle: { dept:'culture', label:'サークル広場', lx:22.5, ly:36.3,
    desc:'サークルのテントが集まる広場。部門をこえた集まりの場所。',
    todo:['サークルごとのテント（部室）','メンバー募集の看板','活動予定'] },
  pier:   { dept:'all', label:'船着き場', lx:16.6, ly:40.4,
    desc:'島の入口。ログインするとここに着く。',
    todo:['はじめての人向けの案内','今日やることのサマリー'] },
};

/* ============ マス目データを作る ============ */
const grid = v => Array.from({ length:H }, () => Array(W).fill(v));
const paint = (g, rects, v) => rects.forEach(([x, y, w, h]) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && i >= 0 && i < W) g[j][i] = v; });
const tier = grid(0), sand = grid(0), water = grid(0), road = grid(0), plaza = grid(0);
paint(tier, GRASS, 1); paint(tier, TIER2, 2); paint(tier, TIER3, 3);
paint(sand, BEACH, 1); paint(water, WATER, 1); paint(road, ROADS, 1); paint(plaza, PLAZAS, 1);
const at = (g, x, y) => (g[y] && g[y][x]) || 0;
// 条件に合うマスをまとめて1本のパスにする
const tiles = (test, inset = 0) => {     // 外側の辺だけ inset ぶん内側に寄せる
  let d = '';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!test(x, y)) continue;
    const l = test(x - 1, y) ? 0 : inset, r = test(x + 1, y) ? 0 : inset, t = test(x, y - 1) ? 0 : inset, b = test(x, y + 1) ? 0 : inset;
    d += `M${OX + x * T + l} ${OY + y * T + t}h${T - l - r}v${T - t - b}h${-(T - l - r)}z`;
  }
  return d;
};
const layer = (test, fill, grow, extra = {}, inset = 0) => el('path', { d:tiles(test, inset), fill, stroke:fill, 'stroke-width':grow, 'stroke-linejoin':'round', ...extra });
const cx = x => OX + (x + .5) * T, cy = y => OY + (y + .5) * T;

/* ============ 地形を描く ============ */
el('rect', { width:900, height:1200, fill:'#79c9c4' });
const waves = el('g', { class:'wave', fill:'none', stroke:'#b9e8e2', 'stroke-width':4, 'stroke-linecap':'round', opacity:.8 });
[[30,40],[700,30],[10,300],[850,150],[4,640],[856,560],[30,1040],[780,1130],[300,1170],[560,1172],[120,1150],[240,30],[850,1000]].forEach(([x, y]) => el('path', { d:`M${x} ${y}q10-9 20 0t20 0` }, waves));

const land = (x, y) => at(tier, x, y) > 0 || at(sand, x, y);
layer(land, '#a9e0d9', 62);                                             // 浅瀬
layer(land, '#f4e3b5', 30);                                             // 砂浜
ROCKS.forEach(([x, y], i) => {                                          // 岩場
  const g = el('g', { transform:`translate(${cx(x)} ${cy(y)}) rotate(${i * 47})` });
  el('path', { d:'M-17 4q-4-17 10-19 17-3 21 11 2 12-14 13-15 1-17-5z', fill:'#5d6b78' }, g);
  el('path', { d:'M-9-4q4-8 13-6', stroke:'#8795a1', 'stroke-width':3, 'stroke-linecap':'round', fill:'none' }, g);
});
const COL = ['', '#6dbb63', '#8ccf73', '#abe08a'], CLIFF = ['', '', '#4c8f52', '#69a85c'];
layer((x, y) => at(tier, x, y) >= 1, COL[1], 12);
for (const n of [2, 3]) {
  layer((x, y) => at(tier, x, y) >= n, CLIFF[n], 10, { transform:'translate(0 11)' });   // 崖
  layer((x, y) => at(tier, x, y) >= n, COL[n], 10);
}
// 広場・道
layer((x, y) => at(plaza, x, y), '#ead9ae', 8, { stroke:'#d6c08c' }, 2);
layer((x, y) => at(plaza, x, y), '#ead9ae', 2, {}, 4);
const isRoad = (x, y) => at(road, x, y) && at(tier, x, y) > 0 && !at(water, x, y);
layer(isRoad, '#e9d6a6', 6, {}, 6);
// 坂（道が段をまたぐところ）
for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) {
  if (!isRoad(x, y) || !isRoad(x, y - 1) || at(tier, x, y - 1) <= at(tier, x, y)) continue;
  const g = el('g', { transform:`translate(${OX + x * T} ${OY + y * T})` });
  el('rect', { x:3, y:-3, width:T - 6, height:18, rx:3, fill:'#cdb37a' }, g);
  for (const k of [1, 6, 11]) el('path', { d:`M5 ${k}h${T - 10}`, stroke:'#f6ead0', 'stroke-width':2.5, 'stroke-linecap':'round' }, g);
}
// 川・池
const wet = (x, y) => at(water, x, y);
layer((x, y) => wet(x, y) && at(tier, x, y) > 0, '#3fa3b8', 7, {}, 3);        // 岸
layer((x, y) => wet(x, y) && land(x, y), '#8fdcd8', 2, {}, 4);
layer((x, y) => wet(x, y) && !at(tier, x, y), '#79c9c4', 2, {}, 3);          // 河口は海の色に
for (let y = 0; y < H - 1; y++) for (let x = 0; x < W; x++)                   // 滝
  if (wet(x, y) && wet(x, y + 1) && at(tier, x, y) > at(tier, x, y + 1) && at(tier, x, y + 1) > 0) {
    el('rect', { x:OX + x * T + 4, y:OY + (y + 1) * T - 2, width:T - 8, height:15, fill:'#5fb9cb' });
    for (const k of [8, 14, 20]) el('path', { d:`M${OX + x * T + k} ${OY + (y + 1) * T}v10`, stroke:'#fff', 'stroke-width':3, 'stroke-linecap':'round' });
  }
// 橋（道と川が重なるマス）
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  if (!(at(road, x, y) && wet(x, y) && at(tier, x, y) > 0)) continue;
  const horiz = at(road, x - 1, y) || at(road, x + 1, y);
  const g = el('g', { transform:`translate(${cx(x)} ${cy(y)}) rotate(${horiz ? 0 : 90})` });
  el('rect', { x:-T / 2 - 3, y:-10, width:T + 6, height:20, rx:3, fill:'#c4925a', stroke:'#7d5732', 'stroke-width':2.5 }, g);
  for (const k of [-8, 0, 8]) el('path', { d:`M${k}-9v18`, stroke:'#7d5732', 'stroke-width':1.6, opacity:.6 }, g);
}
// 桟橋と船
el('rect', { x:cx(13) - 10, y:cy(38) - 6, width:20, height:T * 2.6, rx:4, fill:'#c4925a', stroke:'#7d5732', 'stroke-width':2.5 });
el('rect', { x:cx(13) - 26, y:cy(40) + 6, width:52, height:16, rx:4, fill:'#c4925a', stroke:'#7d5732', 'stroke-width':2.5 });
const boat = el('g', { transform:`translate(${cx(11)} ${cy(40) + 8})` });
el('path', { d:'M-16 0h32l-6 12h-20z', fill:'#fff', stroke:'#3b3226', 'stroke-width':2.5, 'stroke-linejoin':'round' }, boat);
el('path', { d:'M0 0v-24l14 18z', fill:'#d9534a', stroke:'#3b3226', 'stroke-width':2.5, 'stroke-linejoin':'round' }, boat);

/* ============ 木（決まった乱数で毎回同じ配置） ============ */
let seed = 20261112; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const busy = grid(0);
HOUSES.forEach(h => h.at.forEach(([x, y]) => paint(busy, [[x, y - 1, 1, 2]], 1)));
BUILDINGS.forEach(b => paint(busy, [[Math.floor(b.x) - 1, Math.floor(b.y) - 2, 3, 5]], 1));
SIGNS.forEach(([x, y]) => paint(busy, [[x, y, 1, 1]], 1));
const treeG = el('g');
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const r = rnd(), jx = (rnd() - .5) * 8, jy = (rnd() - .5) * 8;
  if (!at(tier, x, y) || wet(x, y) || at(road, x, y) || at(plaza, x, y) || at(busy, x, y)) continue;
  if (at(tier, x, y + 1) !== at(tier, x, y) || r > .34) continue;
  const g = el('g', { class:'tree', transform:`translate(${cx(x) + jx} ${cy(y) + jy})` }, treeG);
  if (r < .04) [[-6,2,'#ff9db0'],[5,-3,'#fff'],[4,7,'#ffd166']].forEach(([a, b, c]) => el('circle', { cx:a, cy:b, r:3.6, fill:c, stroke:'#2f6f45', 'stroke-width':1 }, g));
  else { el('circle', { cx:0, cy:3, r:10, fill:'#2c7a48', opacity:.35 }, g); el('circle', { r:10, fill:'#2f8a4e' }, g); el('circle', { cx:-3, cy:-3, r:4, fill:'#58b06a' }, g); }
}

/* ============ アイコン ============ */
const spots = el('g');
const mkSpot = info => { const g = el('g', { class:'spot', tabindex:0, role:'button', 'data-dept':info.dept, 'aria-label':info.label }, spots); g.info = info; return g; };
const inner = (g, x, y) => el('g', { transform:`translate(${x} ${y})` }, el('g', { class:'bob' }, g));
const housePin = (g, x, y, color) => {
  const t = inner(g, cx(x), cy(y));
  el('ellipse', { cx:0, cy:12, rx:11, ry:3.5, fill:'#000', opacity:.18 }, t);
  el('path', { class:'hit', d:'M-11 12v-13l11-10 11 10v13z', fill:color, stroke:'#fff', 'stroke-width':3, 'stroke-linejoin':'round' }, t);
  el('rect', { x:-3, y:3, width:6, height:9, rx:1.5, fill:'#fff' }, t);
  el('rect', { x:-18, y:-18, width:36, height:36, fill:'transparent' }, t);
};
const bigPin = (g, b, d) => {
  const r = b.big ? 27 : 21, t = inner(g, cx(b.x), cy(b.y));
  el('ellipse', { cx:0, cy:r + 9, rx:r * .6, ry:5, fill:'#000', opacity:.2 }, t);
  el('path', { d:`M-9 ${r - 5}L0 ${r + 10}L9 ${r - 5}z`, fill:'#fff' }, t);
  el('circle', { class:'hit', r, fill:d.color, stroke:'#fff', 'stroke-width':5 }, t);
  el('text', { y:r * .36, 'text-anchor':'middle', 'font-size':r, 'font-weight':800, fill:'#fff' }, t).textContent = d.mark;
};
const items = [];
HOUSES.forEach(h => h.at.forEach(([x, y], i) => items.push({ y, draw: () => {
  const d = DEPTS[h.dept], who = h.note || d.name;
  housePin(mkSpot({ dept:h.dept, label:`${who}メンバーの部屋 #${i + 1}`,
    desc:'メンバー1人1人の部屋。本人が自由に飾れる。',
    todo:['自分の担当タスク（やること／進行中／完了）','もらった「ありがとう」やバッジを飾る棚','自分の times へのポスト'] }), x, y, h.note ? '#8f745e' : d.color);
} })));
const timesG = mkSpot(ZONES.times);
SIGNS.forEach(([x, y], i) => {
  const t = inner(timesG, cx(x), cy(y));
  el('path', { d:'M0 0v11', stroke:'#7d5732', 'stroke-width':3, 'stroke-linecap':'round' }, t);
  el('rect', { class:'hit', x:-9, y:-11, width:18, height:13, rx:2.5, fill:['#fff','#ffe9a8','#d6f0ff'][i % 3], stroke:'#3b3226', 'stroke-width':2 }, t);
  el('path', { d:'M-5-7h10M-5-3h6', stroke:'#3b3226', 'stroke-width':1.5, 'stroke-linecap':'round', opacity:.6 }, t);
  el('rect', { x:-16, y:-18, width:32, height:36, fill:'transparent' }, t);
});
const circleG = mkSpot(ZONES.circle);
TENTS.forEach(([x, y, c]) => {
  const t = inner(circleG, cx(x), cy(y));
  el('path', { class:'hit', d:'M-15 11l15-25 15 25z', fill:c, stroke:'#3b3226', 'stroke-width':2.5, 'stroke-linejoin':'round' }, t);
  el('path', { d:'M-4 11l4-10 4 10z', fill:'#3b3226', opacity:.75 }, t);
});
el('rect', { x:cx(10) - 14, y:cy(38) - 10, width:140, height:100, fill:'transparent' }, mkSpot(ZONES.pier));
items.sort((a, b) => a.y - b.y).forEach(o => o.draw());
BUILDINGS.forEach(b => bigPin(mkSpot(b), b, DEPTS[b.dept]));

const labels = el('g');
BUILDINGS.forEach(b => el('text', { class:'label' + (b.big ? '' : ' m'), x:cx(b.x), y:cy(b.y) + (b.big ? 64 : 54) }, labels).textContent = b.label);
Object.values(ZONES).forEach(z => el('text', { class:'label s', x:cx(z.lx), y:cy(z.ly) }, labels).textContent = z.label);

/* ============ 操作 ============ */
const sheet = document.getElementById('sheet');
const closeSheet = () => sheet.classList.remove('open');
const open = info => {
  const d = DEPTS[info.dept];
  sheet.style.setProperty('--c', d.color);
  sheet.innerHTML = `<button class="close" aria-label="閉じる">✕</button><span class="tag">${d.name}</span>
    <h2>${info.label}</h2><p>${info.desc}</p><ul>${info.todo.map(t => `<li>${t}</li>`).join('')}</ul>
    <div class="note">※ 試作のため中身は「ここに入れるもの」の案です。まだアクションボードとはつながっていません。</div>`;
  sheet.classList.add('open');
  sheet.querySelector('.close').onclick = closeSheet;
};
spots.addEventListener('click', e => { const g = e.target.closest('.spot'); if (g) open(g.info); });
spots.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(e.target.info); } });
svg.addEventListener('click', e => { if (!e.target.closest('.spot')) closeSheet(); });

const chips = document.getElementById('chips');
let current = null;
Object.entries(DEPTS).forEach(([id, d]) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.style.setProperty('--c', d.color); b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<i></i>${d.name}`;
  b.onclick = () => {
    current = current === id ? null : id;
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b && !!current)));
    svg.classList.toggle('dim', !!current);
    svg.querySelectorAll('.spot').forEach(s => s.classList.toggle('on', s.dataset.dept === current));
  };
  chips.appendChild(b);
});

const stage = document.getElementById('stage');
let zoom = 1, base = 0;
const setZoom = z => {
  const fx = (stage.scrollLeft + stage.clientWidth / 2) / stage.scrollWidth, fy = (stage.scrollTop + stage.clientHeight / 2) / stage.scrollHeight;
  if (!base) base = svg.getBoundingClientRect().width;
  zoom = Math.max(1, Math.min(3, z));
  Object.assign(svg.style, { width:base * zoom + 'px', height:base * zoom * 4 / 3 + 'px', minHeight:'0', margin:'0 auto' });
  stage.scrollLeft = fx * stage.scrollWidth - stage.clientWidth / 2; stage.scrollTop = fy * stage.scrollHeight - stage.clientHeight / 2;
};
document.getElementById('zin').onclick = () => setZoom(zoom + .5);
document.getElementById('zout').onclick = () => setZoom(zoom - .5);
})();
</script>
</body>
</html>
