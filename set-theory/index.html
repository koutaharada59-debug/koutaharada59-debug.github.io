<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>集合 暗記ボード</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 配色はチームみらい アクションボードに準拠 */
  :root, :root[data-theme="light"] {
    --bg: #f6f4ef; --card: #fff; --fg: #0a0a0a; --sub: #4b5563; --muted: #737373;
    --line: #e5e5e5; --frame: #0a0a0a; --track: #e5e7eb; --chip: #f3f4f6;
    --primary: #2ba68f; --primary-hover: #26957f; --on-primary: #fafafa;
    --yellow: #fde047; --ok: #15803d; --ng: #dc2626;
    --explain-bg: #f0fdfa; --explain-fg: #0f766e;
    --hero: linear-gradient(90deg, #64d8c6, #bcecd3);
    --level: linear-gradient(90deg, #30baa7, #47c991);
    --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
  }
  :root[data-theme="dark"] {
    --bg: #101413; --card: #1b2120; --fg: #f2f2f2; --sub: #b8bfbd; --muted: #8b9391;
    --line: #2d3533; --frame: #4b5553; --track: #2d3533; --chip: #262d2c;
    --primary: #3cc4aa; --primary-hover: #34b39b; --on-primary: #08201b;
    --yellow: #facc15; --ok: #4ade80; --ng: #f87171;
    --explain-bg: #12302b; --explain-fg: #99f6e4;
    --hero: linear-gradient(90deg, #1f5c53, #24493a);
    --shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101413; --card: #1b2120; --fg: #f2f2f2; --sub: #b8bfbd; --muted: #8b9391;
      --line: #2d3533; --frame: #4b5553; --track: #2d3533; --chip: #262d2c;
      --primary: #3cc4aa; --primary-hover: #34b39b; --on-primary: #08201b;
      --yellow: #facc15; --ok: #4ade80; --ng: #f87171;
      --explain-bg: #12302b; --explain-fg: #99f6e4;
      --hero: linear-gradient(90deg, #1f5c53, #24493a);
      --shadow: 0 1px 3px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Cambria Math", "STIX Two Math", sans-serif;
    -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  a { color: inherit; }
  .math { white-space: pre-line; }

  /* ---------- navbar ---------- */
  .nav { position: sticky; top: 16px; z-index: 30; display: flex; justify-content: center; height: 64px; }
  .nav-inner {
    width: 100%; margin: 0 16px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-bottom: 1px solid var(--line); border-radius: 16px; font-size: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; text-decoration: none; }
  .brand-mark { width: 32px; height: 32px; border-radius: 50%; background: var(--level); display: grid; place-items: center; color: #fff; font-size: 17px; }
  .nav-links { display: flex; align-items: center; gap: 16px; font-weight: 700; }
  .nav-links a { text-decoration: none; }
  .lv-pill { background: var(--chip); border-radius: 99px; padding: 4px 10px; font-size: 13px; }

  /* ---------- hero / profile ---------- */
  .hero { margin-top: -96px; padding-top: 96px; background: var(--hero); }
  .profile-wrap { display: flex; justify-content: center; padding: 24px 16px; }
  .profile { width: 100%; max-width: 512px; background: var(--card); border-radius: 6px; padding: 24px; }
  .profile-row { display: flex; align-items: center; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--level); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 700; flex-shrink: 0; }
  .profile-info { margin-left: 24px; min-width: 0; }
  .p-name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .p-name button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 4px; }
  .p-lv { display: flex; align-items: baseline; margin-top: 8px; gap: 16px; }
  .p-lv b { font-size: 14px; }
  .p-lv strong { font-size: 22px; margin-left: 4px; line-height: 1; }
  .p-lv span { font-size: 14px; }
  .p-xp { margin-top: 8px; font-size: 14px; color: var(--sub); }
  .next { display: flex; font-size: 14px; margin: 16px 0 8px; }
  .next b { font-weight: 700; }
  .track { width: 100%; height: 12px; border-radius: 99px; background: var(--track); box-shadow: inset 0 2px 4px rgba(0,0,0,.05); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; background: var(--level); transition: width 1s cubic-bezier(.22,1,.36,1); }

  /* ---------- metrics ---------- */
  .metrics { max-width: 512px; margin: 0 auto; padding: 24px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metric { background: var(--card); border: 1px solid var(--frame); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; text-align: center; }
  .metric small { display: block; font-size: 12px; color: var(--sub); font-weight: 500; }
  .metric strong { display: block; font-size: 28px; font-weight: 700; color: var(--primary); margin-top: 4px; }
  .metric strong span { font-size: 14px; color: var(--muted); font-weight: 500; }

  /* ---------- sections ---------- */
  .page-title { text-align: center; font-size: 24px; font-weight: 500; margin: 56px 0 8px; }
  .cat { margin-top: 36px; }
  .cat h3 { font-size: 20px; font-weight: 700; margin: 0; padding: 0 16px; max-width: 1400px; margin-inline: auto; }
  .cat h3 small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 8px; }
  .hscroll-wrap { position: relative; max-width: 1400px; margin: 0 auto; }
  .hscroll { overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
  .hscroll::-webkit-scrollbar { display: none; }
  .hscroll-row { display: flex; width: max-content; gap: 16px; padding: 16px 16px 8px; }
  .hscroll-row > * { width: 300px; flex-shrink: 0; scroll-snap-align: start; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); display: none; font-size: 18px;
  }
  .arrow.l { left: 4px; } .arrow.r { right: 4px; }
  @media (hover: hover) and (min-width: 768px) { .arrow.show { display: grid; place-items: center; } }

  /* ---------- mission card ---------- */
  .card { background: var(--card); color: var(--fg); border: 1px solid var(--frame); border-radius: 12px; box-shadow: var(--shadow); }
  .m-card { display: flex; flex-direction: column; height: 100%; }
  .m-head { display: flex; align-items: center; gap: 16px; padding: 24px 24px 16px; }
  .m-icon-col { display: flex; flex-direction: column; align-items: center; }
  .m-icon {
    width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center;
    background: var(--chip); font-size: 34px; font-weight: 700; color: var(--primary);
  }
  .m-icon.feat { background: #fef9c3; }
  .status {
    margin-top: -12px; display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 2px 8px; white-space: nowrap;
  }
  .status.done { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
  .m-title { font-size: 18px; font-weight: 700; line-height: 1.3; margin: 0 0 6px; }
  .m-sub { font-size: 13px; color: var(--sub); font-weight: 500; }
  .m-foot { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 24px; margin-top: auto; }
  .m-meta { display: flex; flex-direction: column; gap: 6px; }
  .m-meta .row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--sub); }
  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 10px; font-size: 14px; font-weight: 500; background: var(--chip); color: var(--sub); }
  .badge.feat { background: rgba(253,224,71,.9); color: #000; }
  .badge.outline { background: transparent; border: 1px solid #9ca3af; }
  .cta {
    display: block; text-align: center; text-decoration: none; box-sizing: border-box;
    width: 100%; border: 0; border-radius: 99px; padding: 15px; font-size: 16px; font-weight: 700;
    background: var(--primary); color: #fff; transition: transform .12s, background .2s;
  }
  .cta:hover { background: var(--primary-hover); }
  .cta:active { transform: scale(.95); }
  .cta.again { background: var(--yellow); color: #000; }

  /* ---------- activities ---------- */
  .acts { max-width: 512px; margin: 0 auto; padding: 0 16px; }
  .act-list { padding: 8px 20px; }
  .act { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .act:first-child { border-top: 0; }
  .act .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--level); color: #fff; display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
  .act time { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 20px; }

  /* ---------- detail ---------- */
  .detail { max-width: 672px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-direction: column; gap: 16px; }
  .crumb { font-size: 14px; color: var(--sub); display: flex; gap: 6px; flex-wrap: wrap; }
  .crumb a { text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .pad { padding: 24px; }
  .d-head { display: flex; gap: 16px; align-items: flex-start; }
  .d-head .m-icon { width: 64px; height: 64px; font-size: 28px; flex-shrink: 0; }
  .d-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .d-body { margin-top: 20px; color: var(--sub); line-height: 1.75; font-size: 15px; }
  .h-card { font-size: 18px; font-weight: 700; margin: 0; }
  .note { font-size: 14px; color: var(--muted); margin: 12px 0 0; }
  .study-item { border-top: 1px solid var(--line); padding: 12px 0; }
  .study-item:first-of-type { margin-top: 12px; }
  .study-q { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: none; padding: 0; font-size: 14px; font-weight: 500; line-height: 1.6; }
  .study-q .tg { flex-shrink: 0; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; margin-top: 2px; color: #fff; }
  .study-q .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
  .study-item.open .chev { transform: rotate(180deg); }
  .study-a { display: none; margin: 10px 0 0; background: var(--explain-bg); color: var(--explain-fg); border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.75; }
  .study-item.open .study-a { display: block; }

  .q-title { font-weight: 700; margin: 0 0 24px; line-height: 1.6; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.6; cursor: pointer; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: var(--muted); }
  .opt input { margin: 4px 0 0; width: 16px; height: 16px; accent-color: var(--primary); flex-shrink: 0; }
  .opt.sel { border-color: var(--primary); background: var(--explain-bg); }
  .opt.res { cursor: default; }
  .opt.res:hover { border-color: var(--line); }
  .opt .ic { width: 16px; height: 16px; flex-shrink: 0; margin-top: 3px; border-radius: 50%; border: 2px solid #d1d5db; display: grid; place-items: center; font-size: 10px; color: #fff; font-weight: 700; }
  .opt.correct { border-color: var(--ok); color: var(--ok); font-weight: 500; }
  .opt.correct .ic { background: var(--ok); border-color: var(--ok); }
  .opt.wrong { border-color: var(--ng); color: var(--ng); font-weight: 500; }
  .opt.wrong .ic { background: var(--ng); border-color: var(--ng); }
  .verdict { font-weight: 700; margin: -12px 0 12px; }
  .verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
  .explain { margin-top: 24px; background: var(--explain-bg); border-radius: 8px; padding: 16px; }
  .explain div { font-size: 14px; font-weight: 500; color: var(--explain-fg); margin-bottom: 4px; }
  .explain p { margin: 0; font-size: 14px; color: var(--explain-fg); line-height: 1.75; }
  .btn { width: 100%; border: 0; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 600; background: var(--primary); color: var(--on-primary); }
  .btn.lg { padding: 13px 16px; font-size: 15px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.outline { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  .help { font-size: 14px; color: var(--muted); text-align: center; margin: 12px 0 0; }
  .result-title { font-size: 20px; font-weight: 700; display: flex; gap: 8px; margin: 0 0 24px; }
  .result-title span { color: var(--primary); }
  .result-msg { margin: 0 0 16px; }
  .result-msg.ng { color: var(--ng); }
  .related h3 { font-size: 18px; margin: 24px 0 0; }
  .related .hscroll-row { padding-left: 0; }

  /* ---------- dialogs / toast ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; padding: 18px; }
  .overlay.show { display: flex; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .dialog { position: relative; width: 100%; max-width: 448px; background: var(--card); border-radius: 16px; padding: 18px; animation: zoom .25s cubic-bezier(.22,1,.36,1); }
  @keyframes zoom { from { opacity: 0; transform: scale(.95); } }
  .x { position: absolute; top: 12px; right: 12px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 4px; }
  .dialog h2 { text-align: center; font-size: 20px; margin: 8px 0 16px; }
  .dialog .desc { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .clear-img {
    border-radius: 8px; background: var(--hero); min-height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; color: #0a3d35;
  }
  .clear-img small { font-size: 13px; letter-spacing: .3em; font-weight: 700; }
  .clear-img strong { font-size: 22px; margin: 8px 0; }
  .clear-img span { font-size: 13px; font-weight: 500; }
  .gain { text-align: center; font-size: 14px; font-weight: 500; margin: 16px 0; }
  .gain b { color: var(--primary); font-size: 18px; }
  .lvup { max-width: 360px; text-align: center; padding: 24px; }
  .lvup h2 { font-size: 24px; line-height: 1.4; }
  .lv-circle {
    width: 134px; height: 134px; border-radius: 50%; background: var(--level); margin: 12px auto 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff;
    animation: bounce .6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes bounce { from { transform: scale(.4); opacity: 0; } }
  .lv-circle small { font-size: 18px; font-weight: 500; letter-spacing: .1em; line-height: 1; }
  .lv-circle strong { font-size: 60px; font-weight: 700; line-height: .85; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 40; width: calc(100% - 32px); max-width: 380px;
    transform: translate(-50%, 140%); transition: transform .4s cubic-bezier(.22,1,.36,1);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,.15); padding: 16px;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; font-size: 14px; }
  .toast-top b { color: var(--primary); font-size: 16px; }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
  .confetti i { position: absolute; top: -10vh; width: 8px; height: 14px; border-radius: 2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall { to { transform: translateY(115vh) rotate(720deg); opacity: .5; } }

  .foot { text-align: center; padding: 48px 16px; font-size: 12px; color: var(--muted); }
  .foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 12px; }

  @media (min-width: 768px) {
    .cat h3, .hscroll-row { padding-left: 40px; }
    .page-title { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="#/"><span class="brand-mark">∈</span>暗記ボード</a>
    <div class="nav-links">
      <span class="lv-pill" id="nav-lv">LV.1</span>
      <a href="../">トップ</a>
    </div>
  </div>
</nav>

<div id="app"></div>

<div class="overlay" id="complete-dialog" role="dialog" aria-modal="true"><div class="dialog" id="complete-body"></div></div>
<div class="overlay" id="lvup-dialog" role="dialog" aria-modal="true"><div class="dialog lvup" id="lvup-body"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= データ（斎藤毅『集合と位相』第1章） ================= */
const TYPES = {
  def:  { label: "定義",       color: "#2f62c9" },
  thm:  { label: "定理・公式", color: "#c8382e" },
  ex:   { label: "例・結論",   color: "#7b44b8" },
  term: { label: "用語",       color: "#2b8a4b" },
  warn: { label: "落とし穴",   color: "#d07a12" },
};
const SECS = {
  1: { title: "論理と記号", icon: "∀" },
  2: { title: "集合の構成", icon: "∅" },
  3: { title: "関係：同値関係と順序", icon: "∼" },
  4: { title: "証明の型と頻出の結論", icon: "∴" },
};

// [id, 節, 種類, 問, 答]
const CARDS = [
  ["1-01", 1, "def", "X ⊂ Y の定義を論理記号で", "∀x (x ∈ X ⇒ x ∈ Y)\nX ⊃ Y は Y ⊂ X のこと。"],
  ["1-02", 1, "def", "X = Y の定義（同値な言い換え2通り）", "X ⊂ Y ∧ X ⊃ Y ⇔ ∀x (x ∈ X ⇔ x ∈ Y)\n示すには両方向の包含を示す。"],
  ["1-03", 1, "def", "真部分集合 X ⊊ Y の定義", "X ⊂ Y ∧ X ≠ Y"],
  ["1-04", 1, "thm", "包含 ⊂ がみたす2つの基本性質", "反射：X ⊂ X\n推移：X ⊂ Y ∧ Y ⊂ Z ⇒ X ⊂ Z"],
  ["1-05", 1, "def", "P ⇔ Q の定義", "(P ⇒ Q) ∧ (Q ⇒ P)"],
  ["1-06", 1, "def", "P ⇒ Q の逆と対偶", "逆：Q ⇒ P\n対偶：¬Q ⇒ ¬P（もとの命題と同値）"],
  ["1-07", 1, "def", "論理記号の優先順位（弱 → 強）", "∧, ∨, ⇒ → ¬ → ∈, ⊂"],
  ["1-08", 1, "def", "略記 ∀x ∈ X, P と ∃x ∈ X, P の意味", "∀x ∈ X, P ⇔ ∀x (x ∈ X ⇒ P)\n∃x ∈ X, P ⇔ ∃x (x ∈ X ∧ P)\n∀ は ⇒ と、∃ は ∧ と組み合わせる。"],
  ["1-09", 1, "thm", "二重否定（排中律）と背理法", "¬(¬P) ⇔ P\nP の否定から矛盾を導き P を示すのが背理法。"],
  ["1-10", 1, "thm", "ド・モルガンの法則（論理）", "¬(P ∨ Q) ⇔ ¬P ∧ ¬Q\n¬(P ∧ Q) ⇔ ¬P ∨ ¬Q"],
  ["1-11", 1, "thm", "P ⇒ Q は何の略記と考えられる？", "¬P ∨ Q\n（P ∨ Q を ¬(¬P ∧ ¬Q) で定義することもできる）"],
  ["1-12", 1, "warn", "∀x (P ⇒ Q) と (∀x P) ⇒ Q は同じ意味？", "違う。後者は仮定 ∀x P が成り立たないことが多く、仮定が偽なら含意は常に真。"],
  ["1-13", 1, "warn", "P ⇒ Q が成り立てば Q ⇒ P も成り立つ？", "成り立つとは限らない。"],

/* ================= レベル計算（アクションボードと同じ式） ================= */
const xpDelta = L => 40 + 15 * (L - 1);
const totalXp = L => (L - 1) * (25 + (15 / 2) * L);
const calcLevel = xp => { let L = 1; while (totalXp(L + 1) <= xp && L < 1000) L++; return L; };
const toNext = xp => Math.max(0, totalXp(calcLevel(xp) + 1) - xp);
const progress = xp => { const L = calcLevel(xp), d = xpDelta(L); return Math.max(0, Math.min(1, (d - toNext(xp)) / d)); };
const missionXp = (difficulty, featured) => [0, 50, 100, 200, 400, 800][difficulty] * (featured ? 2 : 1);

S.xp ??= 0; S.clears ??= {}; S.miss ??= {}; S.correct ??= {}; S.log ??= []; S.name ??= "あなた";
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const stars = n => "⭐".repeat(n);
const $ = s => document.querySelector(s);

function weakMission() {
  const ids = Object.entries(S.miss).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id]) => id);
  if (!ids.length) return null;
  return { slug: WEAK_SLUG, sec: 0, title: "苦手克服ミッション", difficulty: 3, cards: ids, featured: true,
    desc: "これまでに間違えた問題から、間違いが多いものを最大5問出題します。正解すると苦手リストから外れていきます。" };
}
const findMission = slug => slug === WEAK_SLUG ? weakMission() : MISSIONS.find(m => m.slug === slug);
const iconOf = m => m.featured ? "🔥" : SECS[m.sec].icon;

function progressBlock(xp, id = "") {
  return `<div class="next"><span>次のレベルまで</span><b>${Math.round(toNext(xp)).toLocaleString()}ポイント🔥</b></div>
    <div class="track"><div class="fill" ${id ? `id="${id}"` : ""} style="width:${progress(xp) * 100}%"></div></div>`;
}

  const status = n > 0
    ? `<span class="status done">✓ 達成済み</span>`
    : `<span class="status">◌ ${n}回達成</span>`;
  return `<article class="card m-card">
    <div class="m-head">
      <div class="m-icon-col"><div class="m-icon${m.featured ? " feat" : ""}">${iconOf(m)}</div>${status}</div>
      <div><h4 class="m-title">${esc(m.title)}</h4><div class="m-sub">${m.featured ? "間違えた問題から出題" : `§${m.sec} ${SECS[m.sec].title}`}</div></div>
    </div>
    <div class="m-foot">
      <div class="m-meta">
        <div class="row">📝 全${m.cards.length}問 ・ ${n > 0 ? `${n}回クリア` : "未挑戦"}</div>
        <div class="row">
          <span class="badge">難易度 ${stars(m.difficulty)}</span>
          <span class="badge${m.featured ? " feat" : ""}">${missionXp(m.difficulty)}P${m.featured ? " x 2" : ""}</span>
        </div>
      </div>
      <a class="cta${n > 0 ? " again" : ""}" href="#/missions/${m.slug}">${n > 0 ? "もう一回チャレンジ🔥" : "今すぐチャレンジ🔥"}</a>
    </div>
  </article>`;
}

function hscroll(inner) {
  return `<div class="hscroll-wrap"><button class="arrow l" aria-label="左へ">‹</button><div class="hscroll"><div class="hscroll-row">${inner}</div></div><button class="arrow r" aria-label="右へ">›</button></div>`;
}
function wireScroll() {
  document.querySelectorAll(".hscroll-wrap").forEach(w => {
    const sc = w.querySelector(".hscroll"), l = w.querySelector(".arrow.l"), r = w.querySelector(".arrow.r");
    const upd = () => { l.classList.toggle("show", sc.scrollLeft > 0); r.classList.toggle("show", sc.scrollLeft < sc.scrollWidth - sc.clientWidth - 1); };
    l.onclick = () => sc.scrollBy({ left: -316, behavior: "smooth" });
    r.onclick = () => sc.scrollBy({ left: 316, behavior: "smooth" });
    sc.addEventListener("scroll", upd, { passive: true }); new ResizeObserver(upd).observe(sc); upd();
  });
}

function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "たった今";
  if (s < 3600) return `${s / 60 | 0}分前`;
  if (s < 86400) return `${s / 3600 | 0}時間前`;
  return `${s / 86400 | 0}日前`;
}

/* ================= ホーム ================= */
function renderHome() {
  const L = calcLevel(S.xp);
  const cleared = MISSIONS.filter(m => S.clears[m.slug]).length;
  const learned = CARDS.filter(c => S.correct[c[0]] && !S.miss[c[0]]).length;
  const weak = weakMission();
  const firstUncleared = MISSIONS.filter(m => !S.clears[m.slug]).slice(0, 3);

  $("#app").innerHTML = `
    <section class="hero"><div class="profile-wrap"><div class="profile">
      <div class="profile-row">
        <div class="avatar">${esc(S.name.slice(0, 1))}</div>
        <div class="profile-info">
          <div class="p-name">${esc(S.name)}<button id="rename" aria-label="名前を変更">✎</button></div>
          <div class="p-lv"><div><b>LV.</b><strong>${L}</strong></div><span>📖 第1章 集合</span></div>
          <div class="p-xp">${S.xp.toLocaleString()} ポイント</div>
        </div>
      </div>
      ${progressBlock(S.xp)}
    </div></div></section>

    <section class="metrics">
      <div class="metric"><small>クリアしたミッション</small><strong>${cleared}<span> / ${MISSIONS.length}</span></strong></div>
      <div class="metric"><small>覚えた問題</small><strong>${learned}<span> / ${CARDS.length}</span></strong></div>
    </section>

    ${firstUncleared.length && cleared < 3 ? `
    <section class="cat"><h3>🔰 はじめのミッション</h3>${hscroll(firstUncleared.map(missionCard).join(""))}</section>` : ""}

    ${weak ? `<section class="cat"><h3>🔥 苦手克服</h3>${hscroll(missionCard(weak))}</section>` : ""}

    <h2 class="page-title">🎯 ミッション</h2>
    ${Object.entries(SECS).map(([k, s]) => {
      const ms = MISSIONS.filter(m => m.sec == k);
      const done = ms.filter(m => S.clears[m.slug]).length;
      return `<section class="cat"><h3>${k}. ${s.title}<small>${done}/${ms.length} クリア</small></h3>${hscroll(ms.map(missionCard).join(""))}</section>`;
    }).join("")}

    <h2 class="page-title">⚡ 活動タイムライン</h2>
    <section class="acts"><div class="card act-list">
      ${S.log.length ? S.log.slice(0, 10).map(e => `<div class="act"><span class="dot">${esc(S.name.slice(0, 1))}</span><span>「${esc(e.title)}」を達成しました！</span><time>${ago(e.t)}</time></div>`).join("")
        : `<div class="empty">ミッションを達成するとここに表示されます</div>`}
    </div></section>

    <footer class="foot">斎藤毅『集合と位相』第1章 暗記事項まとめより ・ <button id="reset">記録をリセット</button></footer>`;

  $("#rename").onclick = () => { const n = prompt("表示名", S.name); if (n && n.trim()) { S.name = n.trim().slice(0, 20); save(); render(); } };
  $("#reset").onclick = () => { if (confirm("ポイント・達成記録をすべて消去しますか？")) { localStorage.removeItem(KEY); location.reload(); } };
  wireScroll();
}

/* ================= ミッション詳細 ================= */
let quiz = null; // { slug, questions:[{id, options:[cardId...]}], answers:{}, result }

function buildQuiz(m) {
  return {
    slug: m.slug, mission: m, answers: {}, result: null,
    questions: shuffle(m.cards).map(id => {
      const c = CARD[id];
      const others = CARDS.filter(x => x[0] !== id).map(x => CARD[x[0]]);
      const rank = x => (x.sec === c.sec ? 0 : 2) + (x.type === c.type ? 0 : 1);
      const pool = shuffle(others).sort((a, b) => rank(a) - rank(b));
      const distract = [];
      for (const x of pool) { if (distract.length === 3) break; if (!distract.some(d => d.a === x.a)) distract.push(x); }
      return { id, options: shuffle([id, ...distract.map(d => d.id)]) };
    }),
  };
}

function renderMission(slug) {
  const m = (quiz && quiz.slug === slug && quiz.mission) || findMission(slug);
  if (!m) { $("#app").innerHTML = `<div class="detail"><div class="card pad">ミッションが見つかりません。<p><a href="#/">ホームへ戻る</a></p></div></div>`; return; }
  if (!quiz || quiz.slug !== slug) quiz = buildQuiz(m);
  const n = S.clears[m.slug] || 0;
  const related = m.featured ? MISSIONS.filter(x => !S.clears[x.slug]).slice(0, 6) : MISSIONS.filter(x => x.sec === m.sec && x.slug !== m.slug);

  const studyCard = `<div class="card pad">
      <h3 class="h-card">学習カード</h3>
      <p class="note">カードで答えを確認してからクイズに挑戦しましょう！</p>
      ${m.cards.map(id => { const c = CARD[id], t = TYPES[c.type]; return `
        <div class="study-item">
          <button class="study-q"><span class="tg" style="background:${t.color}">${t.label}</span><span class="math">${esc(c.q)}</span><span class="chev">⌄</span></button>
          <div class="study-a math">${esc(c.a)}</div>
        </div>`; }).join("")}
    </div>`;

  let quizHTML;
  if (!quiz.result) {
    const all = quiz.questions.every(q => quiz.answers[q.id]);
    quizHTML = quiz.questions.map((q, i) => `
      <div class="card pad">
        <h3 class="q-title math">Q${i + 1}. ${esc(CARD[q.id].q)}</h3>
        <div class="opts">${q.options.map(o => `
          <label class="opt${quiz.answers[q.id] === o ? " sel" : ""}">
            <input type="radio" name="q-${q.id}" value="${o}" ${quiz.answers[q.id] === o ? "checked" : ""} data-q="${q.id}">
            <span class="math">${esc(CARD[o].a)}</span>
          </label>`).join("")}</div>
      </div>`).join("") + `
      <div class="card pad">
        <button class="btn" id="submit" ${all ? "" : "disabled"}>回答する</button>
        ${all ? "" : `<p class="help">すべての問題に回答してから提出してください</p>`}
      </div>`;
  } else {
    const r = quiz.result;
    quizHTML = quiz.questions.map((q, i) => {
      const ok = quiz.answers[q.id] === q.id;
      return `<div class="card pad">
        <h3 class="q-title math">Q${i + 1}. ${esc(CARD[q.id].q)}</h3>
        <div class="verdict ${ok ? "ok" : "ng"}">${ok ? "正解" : "不正解"}</div>
        <div class="opts">${q.options.map(o => {
          const cls = o === q.id ? "correct" : (o === quiz.answers[q.id] ? "wrong" : "");
          return `<div class="opt res ${cls}"><span class="ic">${cls === "correct" ? "✓" : cls === "wrong" ? "✕" : ""}</span><span class="math">${esc(CARD[o].a)}</span></div>`;
        }).join("")}</div>
        <div class="explain"><div>解説</div><p class="math">${esc(CARD[q.id].a)}</p></div>
      </div>`;
    }).join("") + `
      <div class="card pad" id="result-card">
        <div class="result-title"><div>結果: ${r.total}問中</div><span>${r.correct}問正解</span></div>
        ${r.passed
          ? `<p class="result-msg">ミッション達成！${m.featured ? "苦手克服" : SECS[m.sec].title}マスターですね！</p>
             ${r.recorded ? `<button class="btn lg outline" id="retry">もう一回チャレンジする</button>`
                          : `<button class="btn lg" id="record">ミッション完了を記録する</button>`}`
          : `<p class="result-msg ng">全問正解が必要です。再挑戦してください</p><button class="btn outline" id="retry">再挑戦する</button>`}
      </div>`;
  }

  $("#app").innerHTML = `<div class="detail">
    <div class="crumb"><a href="#/">ホーム</a><span>›</span><span>${m.featured ? "苦手克服" : esc(SECS[m.sec].title)}</span></div>
    <div class="card pad">
      <div class="d-head">
        <div class="m-icon${m.featured ? " feat" : ""}">${iconOf(m)}</div>
        <div>
          <h1 class="d-title">${esc(m.title)}</h1>
          <div class="chips">
            <span class="badge outline">難易度: ${stars(m.difficulty)}</span>
            <span class="badge${m.featured ? " feat" : ""}">${missionXp(m.difficulty)}P${m.featured ? " x 2" : ""}</span>
            <span class="badge">${n}回達成</span>
          </div>
        </div>
      </div>
      <div class="d-body">${esc(m.desc)}<br>全${m.cards.length}問。<b>全問正解</b>でミッション達成です。</div>
    </div>
    ${studyCard}
    ${quizHTML}
    ${related.length ? `<section class="related"><h3>${m.featured ? "未クリアのミッション" : "このカテゴリの他のミッション"}</h3>${hscroll(related.map(missionCard).join(""))}</section>` : ""}
  </div>`;

  document.querySelectorAll(".study-q").forEach(b => b.onclick = () => b.parentElement.classList.toggle("open"));
  document.querySelectorAll("input[type=radio]").forEach(inp => inp.onchange = () => {
    quiz.answers[inp.dataset.q] = inp.value;
    const y = scrollY; renderMission(slug); scrollTo(0, y);
  });
  $("#submit")?.addEventListener("click", () => submitQuiz(m));
  $("#retry")?.addEventListener("click", () => { const nm = findMission(slug); if (!nm) { location.hash = "#/"; return; } quiz = buildQuiz(nm); renderMission(slug); scrollTo({ top: 0, behavior: "smooth" }); });
  $("#record")?.addEventListener("click", () => recordClear(m));
  wireScroll();
}

function submitQuiz(m) {
  let correct = 0;
  for (const q of quiz.questions) {
    if (quiz.answers[q.id] === q.id) {
      correct++; S.correct[q.id] = (S.correct[q.id] || 0) + 1;
      if (S.miss[q.id]) { S.miss[q.id]--; if (!S.miss[q.id]) delete S.miss[q.id]; }
    } else {
      S.miss[q.id] = (S.miss[q.id] || 0) + 1;
    }
  }
  save();
  quiz.result = { total: quiz.questions.length, correct, passed: correct === quiz.questions.length, recorded: false };
  renderMission(m.slug);
  setTimeout(() => {
    if (quiz.result.passed) $("#result-card").scrollIntoView({ behavior: "smooth", block: "start" });
    else scrollTo({ top: 0, behavior: "smooth" });
  }, 100);
}

/* ================= 達成フロー：ダイアログ → ポイントトースト → レベルアップ ================= */
function recordClear(m) {
  const gained = missionXp(m.difficulty, m.featured);
  const before = S.xp;
  S.xp += gained;
  S.clears[m.slug] = (S.clears[m.slug] || 0) + 1;
  S.log.unshift({ slug: m.slug, title: m.title, t: Date.now() }); S.log = S.log.slice(0, 30);
  save();
  quiz.result.recorded = true;
  renderMission(m.slug);
  confetti();

  $("#complete-body").innerHTML = `
    <button class="x" data-close aria-label="閉じる">×</button>
    <h2>おめでとうございます！</h2>
    <p class="desc">「${esc(m.title)}」を達成しました！</p>
    <div class="clear-img"><small>MISSION CLEAR</small><strong>${esc(m.title)}</strong><span>${m.featured ? "苦手克服" : `第1章 集合 ・ §${m.sec}`}</span></div>
    <p class="gain"><b>+${gained}</b> ポイント獲得</p>
    <button class="btn" data-close>このまま閉じる</button>`;
  openDialog("#complete-dialog", () => showXpToast(before, gained));
}

function openDialog(sel, onClose) {
  const el = $(sel);
  el.classList.add("show");
  const close = () => { el.classList.remove("show"); el.onclick = null; onClose && onClose(); };
  el.onclick = e => { if (e.target === el || e.target.closest("[data-close]")) close(); };
}

let toastTimer;
function showXpToast(before, gained) {
  const after = before + gained, L0 = calcLevel(before), L1 = calcLevel(after);
  const t = $("#toast");
  t.innerHTML = `<div class="toast-top"><span>LV.${L0}</span><b>+${gained} ポイント</b></div>
    ${progressBlock(before, "toast-fill")}`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    // レベルをまたぐ場合は一度満タンまで伸ばしてからレベルアップ演出
    $("#toast-fill").style.width = (L1 > L0 ? 100 : progress(after) * 100) + "%";
  }));
  toastTimer = setTimeout(() => {
    if (L1 > L0) {
      t.classList.remove("show");
      $("#lvup-body").innerHTML = `<button class="x" data-close aria-label="閉じる">×</button>
        <h2>暗記レベルが<br>アップしました！</h2>
        <div class="lv-circle"><small>LEVEL</small><strong>${L1}</strong></div>
        <button class="btn" data-close>閉じる</button>`;
      openDialog("#lvup-dialog", () => { confettiStop(); });
      confetti();
    } else {
      setTimeout(() => t.classList.remove("show"), 2000);
    }
  }, 1300);
  updateNav();
}

let confettiEl;
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  confettiStop();
  confettiEl = document.createElement("div"); confettiEl.className = "confetti";
  const colors = ["#30baa7", "#47c991", "#64d8c6", "#fde047", "#f472b6", "#60a5fa"];
  confettiEl.innerHTML = Array.from({ length: 70 }, () =>
    `<i style="left:${Math.random() * 100}%;background:${colors[Math.random() * colors.length | 0]};animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * .6}s;transform:rotate(${Math.random() * 360}deg)"></i>`).join("");
  document.body.appendChild(confettiEl);
  setTimeout(confettiStop, 4800);
}
function confettiStop() { confettiEl?.remove(); confettiEl = null; }

/* ================= ルーティング ================= */
function updateNav() { $("#nav-lv").textContent = `LV.${calcLevel(S.xp)}`; }
function render() {
  updateNav();
  const m = location.hash.match(/^#\/missions\/([\w-]+)/);
  if (m) renderMission(m[1]); else { quiz = null; renderHome(); }
}
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".overlay.show [data-close]")[0]?.click(); });
render();
</script>
