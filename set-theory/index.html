<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>集合 暗記ボード</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>∈</text></svg>">
<style>
  :root, :root[data-theme="light"] {
    --bg:#f4f4f2; --panel:#ebebe8; --card:#fff; --fg:#141414; --dim:#6f6f6f; --line:#dadad6; --accent:#141414; --on-accent:#fff;
    --def:#2f62c9; --thm:#c8382e; --ex:#7b44b8; --term:#2b8a4b; --warn:#d07a12;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"] {
    --bg:#111; --panel:#1a1a1a; --card:#232323; --fg:#f0f0f0; --dim:#8c8c8c; --line:#303030; --accent:#f0f0f0; --on-accent:#111;
    --def:#6d9bf5; --thm:#f07167; --ex:#b48ae6; --term:#5cc483; --warn:#f0a443;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#111; --panel:#1a1a1a; --card:#232323; --fg:#f0f0f0; --dim:#8c8c8c; --line:#303030; --accent:#f0f0f0; --on-accent:#111;
      --def:#6d9bf5; --thm:#f07167; --ex:#b48ae6; --term:#5cc483; --warn:#f0a443;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", "Cambria Math", "STIX Two Math", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

  /* ---------- header ---------- */
  header { max-width: 1200px; margin: 0 auto; padding: 24px 16px 8px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .back { color: var(--dim); text-decoration: none; font-size: 13px; }
  h1 { font-size: 20px; margin: 6px 0 2px; letter-spacing: .03em; }
  .sub { color: var(--dim); font-size: 13px; margin: 0; }
  .spacer { flex: 1; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

  .progress { margin: 16px 0 4px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--dim); }
  .bar { flex: 1; height: 8px; border-radius: 99px; background: var(--panel); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; transition: width .4s cubic-bezier(.22,1,.36,1); }
  .bar .b-learning { background: var(--warn); }
  .bar .b-done { background: var(--term); }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); border-radius: 99px;
    padding: 5px 12px; font-size: 12.5px; color: var(--dim); white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filter-row::-webkit-scrollbar { display: none; }

  /* ---------- tabs (mobile) ---------- */
  .tabs { display: none; max-width: 1200px; margin: 12px auto 0; padding: 0 16px; }
  .tabs-inner { display: flex; background: var(--panel); border-radius: 10px; padding: 3px; }
  .tab { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-size: 13px; color: var(--dim); }
  .tab[aria-selected="true"] { background: var(--card); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }

  /* ---------- board ---------- */
  .board {
    max-width: 1200px; margin: 0 auto; padding: 16px 16px 48px;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start;
  }
  .col { background: var(--panel); border-radius: 12px; padding: 10px; min-height: 200px; transition: outline-color .15s; outline: 2px dashed transparent; outline-offset: -2px; }
  .col.drop { outline-color: var(--dim); }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; }
  .col-title { font-size: 14px; font-weight: 700; }
  .col-dot { width: 9px; height: 9px; border-radius: 50%; }
  .count { font-size: 12px; color: var(--dim); background: var(--card); border-radius: 99px; padding: 1px 8px; }
  .study-btn {
    margin-left: auto; border: 0; background: var(--accent); color: var(--on-accent);
    border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 600;
  }
  .study-btn:disabled { opacity: .3; cursor: default; }
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 28px 8px; border: 1px dashed var(--line); border-radius: 10px; }

  .card {
    position: relative; background: var(--card); border-radius: 10px; box-shadow: var(--shadow);
    padding: 10px 12px 10px 15px; cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: transform .15s, opacity .15s;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
  .card.dragging { opacity: .35; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .tag { color: var(--c); font-weight: 700; }
  .q { font-size: 14px; line-height: 1.6; }
  .a {
    display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 13.5px; line-height: 1.75; white-space: pre-line;
  }
  .card.open .a { display: block; }
  .hint { font-size: 11px; color: var(--dim); }
  .card.open .hint { display: none; }
  .moves { display: flex; gap: 6px; margin-top: 8px; }
  .moves button {
    flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 7px;
    padding: 5px 4px; font-size: 12px; color: var(--dim);
  }
  .moves button:hover { color: var(--fg); border-color: var(--dim); }

  /* ---------- study overlay ---------- */
  .study {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: none; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  .study.show { display: flex; }
  .s-top { width: 100%; max-width: 640px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--dim); }
  .s-bar { flex: 1; height: 5px; border-radius: 99px; background: var(--panel); overflow: hidden; }
  .s-bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .s-stage { flex: 1; width: 100%; max-width: 640px; display: flex; align-items: center; justify-content: center; padding: 16px 0; min-height: 0; }
  .s-card {
    position: relative; width: 100%; max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    padding: 22px 22px 22px 26px; cursor: pointer; animation: pop .25s cubic-bezier(.22,1,.36,1);
  }
  .s-card::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .s-card .meta { font-size: 12px; margin-bottom: 10px; }
  .s-card .q { font-size: 18px; line-height: 1.7; font-weight: 600; }
  .s-card .a { font-size: 16px; display: none; margin-top: 16px; padding-top: 16px; }
  .s-card.open .a { display: block; animation: pop .2s; }
  .s-card .hint { margin-top: 18px; font-size: 12px; text-align: center; }
  .s-actions { width: 100%; max-width: 640px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .s-actions button { border: 0; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 700; }
  .s-actions .ng { background: var(--panel); color: var(--fg); }
  .s-actions .ok { background: var(--accent); color: var(--on-accent); }
  .s-actions .reveal { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); }
  .s-actions kbd { font: 11px ui-monospace, monospace; opacity: .55; margin-left: 6px; }
  .s-done { text-align: center; }
  .s-done h2 { font-size: 22px; margin: 0 0 8px; }
  .s-done p { color: var(--dim); margin: 0 0 4px; }

  @media (max-width: 760px) {
    header { padding-top: 16px; }
    .tabs { display: block; }
    .board { grid-template-columns: 1fr; padding-top: 12px; }
    .col { display: none; background: transparent; padding: 0; }
    .col.active { display: block; }
    .col-head .col-title, .col-head .col-dot, .col-head .count { display: none; }
    .study-btn { width: 100%; padding: 10px; font-size: 14px; border-radius: 10px; }
    .col-head { padding: 0 0 10px; }
  }
  @media (hover: none) { .s-actions kbd { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="top">
    <a class="back" href="../">← トップ</a>
    <span class="spacer"></span>
    <button class="icon-btn" id="shuffle" aria-pressed="false" title="学習モードの出題順">順番どおり</button>
    <button class="icon-btn" id="reset">リセット</button>
  </div>
  <h1>第1章 集合 ― 暗記ボード</h1>
  <p class="sub">斎藤毅『集合と位相』第1章。カードをタップで答え表示、ドラッグかボタンで列を移動。</p>

  <div class="progress">
    <div class="bar"><i class="b-done" id="bar-done"></i><i class="b-learning" id="bar-learning"></i></div>
    <span id="progress-text"></span>
  </div>

  <div class="filters">
    <div class="filter-row" id="sec-filters"></div>
    <div class="filter-row" id="type-filters"></div>
  </div>
</header>

<nav class="tabs"><div class="tabs-inner" id="tabs" role="tablist"></div></nav>

<main class="board" id="board"></main>

<section class="study" id="study" aria-modal="true" role="dialog">
  <div class="s-top">
    <button class="icon-btn" id="s-close">✕ 閉じる</button>
    <div class="s-bar"><i id="s-bar"></i></div>
    <span id="s-count"></span>
  </div>
  <div class="s-stage" id="s-stage"></div>
  <div class="s-actions" id="s-actions"></div>
</section>

<script>
const TYPES = {
  def:  { label: "定義",       color: "--def" },
  thm:  { label: "定理・公式", color: "--thm" },
  ex:   { label: "例・結論",   color: "--ex" },
  term: { label: "用語",       color: "--term" },
  warn: { label: "落とし穴",   color: "--warn" },
};
const SECS = { 1: "論理と記号", 2: "集合の構成", 3: "同値関係と順序", 4: "証明の型・演習" };
const COLS = [
  { id: "todo",     label: "未着手", color: "--dim" },
  { id: "learning", label: "学習中", color: "--warn" },
  { id: "done",     label: "覚えた", color: "--term" },
];

// [id, 節, 種類, 問, 答]
const CARDS = [
  // 1 論理と記号
  ["1-01", 1, "def", "X ⊂ Y の定義を論理記号で", "∀x (x ∈ X ⇒ x ∈ Y)\nX ⊃ Y は Y ⊂ X のこと。"],
  ["1-02", 1, "def", "X = Y の定義（同値な言い換え2通り）", "X ⊂ Y ∧ X ⊃ Y\n⇔ ∀x (x ∈ X ⇔ x ∈ Y)\n→ 元がぴったり一致すること。示すには両方向の包含を示す。"],
  ["1-03", 1, "def", "真部分集合 X ⊊ Y の定義", "X ⊂ Y ∧ X ≠ Y"],
  ["1-04", 1, "thm", "包含 ⊂ がみたす2つの基本性質", "反射：X ⊂ X\n推移：X ⊂ Y ∧ Y ⊂ Z ⇒ X ⊂ Z"],
  ["1-05", 1, "def", "P ⇔ Q の定義", "(P ⇒ Q) ∧ (Q ⇒ P)"],
  ["1-06", 1, "def", "P ⇒ Q の逆と対偶", "逆：Q ⇒ P\n対偶：¬Q ⇒ ¬P（もとの命題と同値）"],
  ["1-07", 1, "def", "論理記号の優先順位（弱 → 強）", "∧, ∨, ⇒ → ¬ → ∈, ⊂"],
  ["1-08", 1, "def", "略記 ∀x ∈ X, P と ∃x ∈ X, P の意味", "∀x ∈ X, P ⇔ ∀x (x ∈ X ⇒ P)\n∃x ∈ X, P ⇔ ∃x (x ∈ X ∧ P)\n→ ∀ は ⇒ と、∃ は ∧ と組み合わせる。"],
  ["1-09", 1, "thm", "二重否定（排中律）と背理法", "¬(¬P) ⇔ P\nこれを使って、P の否定から矛盾を導き P を示すのが背理法。"],
  ["1-10", 1, "thm", "ド・モルガンの法則（論理）", "¬(P ∨ Q) ⇔ ¬P ∧ ¬Q\n¬(P ∧ Q) ⇔ ¬P ∨ ¬Q"],
  ["1-11", 1, "thm", "P ⇒ Q は何の略記と考えられる？", "¬P ∨ Q\n（P ∨ Q を ¬(¬P ∧ ¬Q) で定義することもできる）"],
  ["1-12", 1, "warn", "∀x (P ⇒ Q) と (∀x P) ⇒ Q は同じ意味？", "違う。後者は仮定 ∀x P が成り立たないことが多く、仮定が偽なら含意は常に真。"],
  ["1-13", 1, "warn", "P ⇒ Q が成り立てば Q ⇒ P も成り立つ？", "成り立つとは限らない。"],
  ["1-14", 1, "warn", "「P かつ Q または R」の問題点", "(P ∧ Q) ∨ R か P ∧ (Q ∨ R) か決まらない。括弧を省かない。"],
  ["1-15", 1, "warn", "「存在する」を読むときの注意", "どの変数にかかっているかを確認する。\n（R_A の定義では、A ではなく長さ n と列 x₀, …, xₙ が存在する）"],

  // 2 集合の構成
  ["2-01", 2, "def", "A = {x ∈ X | P} を論理式で", "∀x (x ∈ A ⇔ (x ∈ X ∧ P))"],
  ["2-02", 2, "def", "{x ∈ X | P} の P に使える条件・使えない条件", "形式化できる条件でなければならない。\n不可：「十分大きい」「限りなく大きくなる」\n可：「n ≥ m」「n は偶数」"],
  ["2-03", 2, "def", "部分集合 A ⊂ X を条件で表すと？", "A = {x ∈ X | x ∈ A}（任意の部分集合は条件で表せる）"],
  ["2-04", 2, "def", "空集合 ∅ の定義と、X = ∅ の言い換え", "∅ = {x ∈ X | x ≠ x}\nX = ∅ ⇔ ∀x (x ∉ X)"],
  ["2-05", 2, "thm", "空集合の包含に関する性質（2つ）", "任意の X に対し ∅ ⊂ X。\n∅ の部分集合は ∅ のみ。"],
  ["2-06", 2, "def", "A = {x ∈ X | P}, B = {x ∈ X | Q} のとき A ⊂ B ⇔ ？\nまた「P は Q より強い」の定義", "A ⊂ B ⇔ (∀x ∈ X, P ⇒ Q)\nP は Q より強い（Q は P より弱い）⇔ A ⊂ B\nP と Q が同値 ⇔ A = B"],
  ["2-07", 2, "def", "{x ∈ X | P} = X ⇔ ？", "P が無条件に成り立つ。"],
  ["2-08", 2, "def", "共通部分 A ∩ B と合併 A ∪ B の定義", "A ∩ B = {x ∈ X | x ∈ A ∧ x ∈ B}\nA ∪ B = {x ∈ X | x ∈ A ∨ x ∈ B}"],
  ["2-09", 2, "def", "「A は B と交わる」の定義と、無縁和 A ⊔ B", "A ∩ B ≠ ∅ のとき交わる。\n交わらない（A ∩ B = ∅）とき A ∪ B を A ⊔ B（無縁和・非交和）と書く。"],
  ["2-10", 2, "def", "補集合 X \\ A の定義と注意点", "X \\ A = {x ∈ X | x ∉ A}（Aᶜ とも書く）\n補集合を考えるには全体集合 X の指定が必要。"],
  ["2-11", 2, "thm", "C ⊂ A ∩ B ⇔ ？　　A ∪ B ⊂ C ⇔ ？", "C ⊂ A ∩ B ⇔ C ⊂ A ∧ C ⊂ B\nA ∪ B ⊂ C ⇔ A ⊂ C ∧ B ⊂ C"],
  ["2-12", 2, "thm", "A ∩ B = A ⇔ ？　　A ∪ B = A ⇔ ？", "A ∩ B = A ⇔ A ⊂ B\nA ∪ B = A ⇔ B ⊂ A"],
  ["2-13", 2, "thm", "分配則（2つ）", "(A ∪ B) ∩ C = (A ∩ C) ∪ (B ∩ C)\n(A ∩ B) ∪ C = (A ∪ C) ∩ (B ∪ C)"],
  ["2-14", 2, "thm", "ド・モルガンの法則（集合）と二重補集合", "X \\ (A ∪ B) = (X \\ A) ∩ (X \\ B)\nX \\ (A ∩ B) = (X \\ A) ∪ (X \\ B)\nX \\ (X \\ A) = A"],
  ["2-15", 2, "thm", "A ⊂ B を補集合と合併で表すと？", "(X \\ A) ∪ B = X"],
  ["2-16", 2, "warn", "ℝ² の x 軸と y 軸：集合としての和と部分空間としての和", "集合としての和は {xy = 0}、部分空間としての和は ℝ² 全体で、一般に一致しない。\n同様に x 軸の補空間は無数にあるが、補集合は {y ≠ 0} ただ1つ。"],
  ["2-17", 2, "def", "巾集合 𝒫(X) の定義", "X の部分集合をすべて元とする集合。\nY = 𝒫(X) ⇔ ∀x (x ∈ Y ⇔ x ⊂ X)\nA ⊂ B ⇔ A ∈ 𝒫(B)\n（正しい漢字は「冪集合」）"],
  ["2-18", 2, "thm", "|X| = n のとき |𝒫(X)| は？", "2ⁿ"],
  ["2-19", 2, "ex", "𝒫(∅) と 𝒫(𝒫(∅)) は？", "𝒫(∅) = {∅}\n𝒫(𝒫(∅)) = {∅, {∅}}"],
  ["2-20", 2, "ex", "∅ ∈ ∅ ？　∅ ∈ 𝒫(∅) ？　∅ = 𝒫(∅) ？", "∅ ∉ ∅、∅ ∈ 𝒫(∅)、∅ ≠ 𝒫(∅)\nさらに ∅ ∈ 𝒫(𝒫(∅))、𝒫(∅) ∈ 𝒫(𝒫(∅))"],
  ["2-21", 2, "def", "X = {a, b} の定義。a = b のときは？", "∀x (x ∈ X ⇔ x = a ∨ x = b)\na = b のとき {a, b} = {a}（元は1つ）。∅ = {}。"],
  ["2-22", 2, "def", "対 (a, b) の定義", "(a, b) := {{a}, {a, b}}\na を第1成分、b を第2成分という。"],
  ["2-23", 2, "thm", "対の性質と、(a, b) を {a, b} で定義できない理由", "(a, b) = (c, d) ⇔ a = c ∧ b = d\n{a, b} = {b, a} なので {a, b} では順序が区別できない。"],
  ["2-24", 2, "def", "積 X × Y の定義", "X × Y = {z ∈ 𝒫(𝒫(X ∪ Y)) | ∃x ∃y (x ∈ X ∧ y ∈ Y ∧ z = (x, y))}"],
  ["2-25", 2, "thm", "|X| = n, |Y| = m のとき |X × Y|、および A ⊂ X ∧ B ⊂ Y のとき", "|X × Y| = nm\nA ⊂ X ∧ B ⊂ Y ⇒ A × B ⊂ X × Y"],
  ["2-26", 2, "def", "n 組 (x₁, …, xₙ) と多数の合併の定義", "(x₁, …, xₙ) := ((x₁, …, xₙ₋₁), xₙ)\n(x₁, …, xₙ) = (y₁, …, yₙ) ⇔ ∀i, xᵢ = yᵢ\nX₁ ∪ … ∪ Xₙ := (X₁ ∪ … ∪ Xₙ₋₁) ∪ Xₙ（帰納的に定義）"],
  ["2-27", 2, "def", "自然数の集合論的構成（0 と n + 1）", "0 = ∅、n + 1 := n ∪ {n}\nn = {0, 1, …, n − 1}（n の元の個数は n 個）"],
  ["2-28", 2, "ex", "1, 2, 3 を集合で書くと？", "1 = {0} = 𝒫(∅)\n2 = {0, 1} = 𝒫(𝒫(∅))\n3 = {0, 1, 2}"],
  ["2-29", 2, "term", "基数と序数", "基数：全部でいくつあるか\n序数：1つ、2つ、と順に数える数え方"],
  ["2-30", 2, "term", "ラッセルの背理", "「すべての集合を元とする集合」が存在すると矛盾する。\n→ 公理的集合論で集合の構成法を制限する。\n（公理的集合論が矛盾を含まないことは証明できないことが証明されている）"],

];

const KEY = "set-theory-ch1-board-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
let saved = load();
const state = {
  status: saved.status || {},
  sec: "all", type: "all",
  tab: "todo", shuffle: !!saved.shuffle,
  open: new Set(),
};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ status: state.status, shuffle: state.shuffle })); } catch {} };
const statusOf = id => state.status[id] || "todo";

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const visible = () => CARDS.filter(c => (state.sec === "all" || c[1] == state.sec) && (state.type === "all" || c[2] === state.type));

/* ---------- filters ---------- */
function renderFilters() {
  const secs = [["all", "すべての節"], ...Object.entries(SECS).map(([k, v]) => [k, `${k}. ${v}`])];
  $("#sec-filters").innerHTML = secs.map(([k, v]) =>
    `<button class="chip" data-sec="${k}" aria-pressed="${state.sec == k}">${v}</button>`).join("");
  const types = [["all", "すべての種類", null], ...Object.entries(TYPES).map(([k, t]) => [k, t.label, t.color])];
  $("#type-filters").innerHTML = types.map(([k, v, c]) =>
    `<button class="chip" data-type="${k}" aria-pressed="${state.type === k}">${c ? `<span class="dot" style="background:var(${c})"></span>` : ""}${v}</button>`).join("");
}
$("#sec-filters").addEventListener("click", e => { const b = e.target.closest("[data-sec]"); if (!b) return; state.sec = b.dataset.sec; render(); });
$("#type-filters").addEventListener("click", e => { const b = e.target.closest("[data-type]"); if (!b) return; state.type = b.dataset.type; render(); });

/* ---------- board ---------- */
function cardHTML(c) {
  const [id, sec, type, q, a] = c;
  const st = statusOf(id), t = TYPES[type];
  const idx = COLS.findIndex(x => x.id === st);
  const prev = COLS[idx - 1], next = COLS[idx + 1];
  return `<article class="card${state.open.has(id) ? " open" : ""}" draggable="true" tabindex="0" data-id="${id}" style="--c:var(${t.color})">
    <div class="meta"><span class="tag">${t.label}</span><span>§${sec}</span></div>
    <div class="q">${esc(q)}</div>
    <div class="hint">タップで答え</div>
    <div class="a">${esc(a)}</div>
    <div class="moves">
      ${prev ? `<button data-move="${prev.id}">← ${prev.label}</button>` : ""}
      ${next ? `<button data-move="${next.id}">${next.label} →</button>` : ""}
    </div>
  </article>`;
}

function render() {
  renderFilters();
  const vis = visible();
  const groups = Object.fromEntries(COLS.map(c => [c.id, []]));
  vis.forEach(c => groups[statusOf(c[0])].push(c));

  $("#tabs").innerHTML = COLS.map(c =>
    `<button class="tab" role="tab" data-tab="${c.id}" aria-selected="${state.tab === c.id}">${c.label} ${groups[c.id].length}</button>`).join("");

  $("#board").innerHTML = COLS.map(col => `
    <section class="col${state.tab === col.id ? " active" : ""}" data-col="${col.id}">
      <div class="col-head">
        <span class="col-dot" style="background:var(${col.color})"></span>
        <span class="col-title">${col.label}</span>
        <span class="count">${groups[col.id].length}</span>
        <button class="study-btn" data-study="${col.id}" ${groups[col.id].length ? "" : "disabled"}>▶ この列を学習</button>
      </div>
      <div class="cards">${groups[col.id].map(cardHTML).join("") || `<div class="empty">${col.id === "done" ? "覚えたカードがここに並びます" : "カードはありません"}</div>`}</div>
    </section>`).join("");

  // 全体の進捗（フィルタに関係なく章全体）
  const total = CARDS.length;
  const n = s => CARDS.filter(c => statusOf(c[0]) === s).length;
  const done = n("done"), learning = n("learning");
  $("#bar-done").style.width = (done / total * 100) + "%";
  $("#bar-learning").style.width = (learning / total * 100) + "%";
  $("#progress-text").textContent = `覚えた ${done} / ${total}`;
  $("#shuffle").textContent = state.shuffle ? "シャッフル" : "順番どおり";
  $("#shuffle").setAttribute("aria-pressed", state.shuffle);
}

function move(id, to) { state.status[id] = to; save(); }

$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; state.tab = b.dataset.tab; render(); });

$("#board").addEventListener("click", e => {
  const s = e.target.closest("[data-study]");
  if (s) return startStudy(s.dataset.study);
  const card = e.target.closest(".card"); if (!card) return;
  const id = card.dataset.id;
  const m = e.target.closest("[data-move]");
  if (m) { move(id, m.dataset.move); state.open.delete(id); return render(); }
  state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  card.classList.toggle("open");
});
$("#board").addEventListener("keydown", e => {
  const card = e.target.closest(".card");
  if (card && e.target === card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); card.click(); }
});

// ドラッグ&ドロップ（デスクトップ）
let dragId = null;
$("#board").addEventListener("dragstart", e => {
  const card = e.target.closest(".card"); if (!card) return;
  dragId = card.dataset.id; card.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId);
});
$("#board").addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".dragging,.drop").forEach(el => el.classList.remove("dragging", "drop")); });
$("#board").addEventListener("dragover", e => {
  const col = e.target.closest(".col"); if (!col || !dragId) return;
  e.preventDefault();
  document.querySelectorAll(".col.drop").forEach(c => c !== col && c.classList.remove("drop"));
  col.classList.add("drop");
});
$("#board").addEventListener("drop", e => {
  const col = e.target.closest(".col"); if (!col || !dragId) return;
  e.preventDefault(); move(dragId, col.dataset.col); dragId = null; render();
});

$("#shuffle").addEventListener("click", () => { state.shuffle = !state.shuffle; save(); render(); });
$("#reset").addEventListener("click", () => {
  if (!confirm("すべてのカードを「未着手」に戻しますか？")) return;
  state.status = {}; state.open.clear(); state.tab = "todo"; save(); render();
});

/* ---------- 学習モード ---------- */
const study = { deck: [], i: 0, ok: 0, ng: [], open: false, from: "" };

function startStudy(colId, deck) {
  study.from = colId;
  study.deck = deck || visible().filter(c => statusOf(c[0]) === colId);
  if (state.shuffle && !deck) study.deck = study.deck.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  study.i = 0; study.ok = 0; study.ng = []; study.open = false;
  $("#study").classList.add("show");
  document.body.style.overflow = "hidden";
  renderStudy();
}
function closeStudy() {
  $("#study").classList.remove("show");
  document.body.style.overflow = "";
  render();
}
function renderStudy() {
  const total = study.deck.length;
  $("#s-bar").style.width = (study.i / total * 100) + "%";
  $("#s-count").textContent = `${Math.min(study.i + 1, total)} / ${total}`;

  if (study.i >= total) {
    $("#s-count").textContent = `${total} / ${total}`;
    $("#s-stage").innerHTML = `<div class="s-done"><h2>おわり</h2><p>覚えた ${study.ok}　まだ ${study.ng.length}</p></div>`;
    $("#s-actions").innerHTML = study.ng.length
      ? `<button class="ng" data-act="close">ボードに戻る</button><button class="ok" data-act="retry">「まだ」をもう一度</button>`
      : `<button class="reveal" data-act="close">ボードに戻る</button>`;
    return;
  }
  const [id, sec, type, q, a] = study.deck[study.i], t = TYPES[type];
  $("#s-stage").innerHTML = `<div class="s-card${study.open ? " open" : ""}" style="--c:var(${t.color})" data-act="flip">
    <div class="meta"><span class="tag">${t.label}</span><span>§${sec} ${SECS[sec]}</span></div>
    <div class="q">${esc(q)}</div>
    <div class="a">${esc(a)}</div>
    ${study.open ? "" : `<div class="hint">タップで答えを表示</div>`}
  </div>`;
  $("#s-actions").innerHTML = study.open
    ? `<button class="ng" data-act="ng">まだ<kbd>←</kbd></button><button class="ok" data-act="ok">覚えた<kbd>→</kbd></button>`
    : `<button class="reveal" data-act="flip">答えを見る<kbd>Space</kbd></button>`;
}
function act(a) {
  if (a === "close") return closeStudy();
  if (a === "retry") return startStudy("learning", study.ng);
  if (study.i >= study.deck.length) return;
  if (a === "flip") { study.open = !study.open; return renderStudy(); }
  if (!study.open) return;
  const card = study.deck[study.i];
  if (a === "ok") { move(card[0], "done"); study.ok++; }
  if (a === "ng") { move(card[0], "learning"); study.ng.push(card); }
  study.i++; study.open = false; renderStudy();
}
$("#study").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b) act(b.dataset.act); });
$("#s-close").addEventListener("click", closeStudy);
addEventListener("keydown", e => {
  if (!$("#study").classList.contains("show")) return;
  if (e.key === "Escape") closeStudy();
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); act(study.i >= study.deck.length ? "close" : "flip"); }
  else if (e.key === "ArrowRight") act("ok");
  else if (e.key === "ArrowLeft") act("ng");
});

render();
</script>
</body>
</html>
